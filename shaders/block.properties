# =========================================================
# GoldenHaze — block ID mapping for mc_Entity
# =========================================================
# Iris/OptiFine fills mc_Entity with these IDs (see lib/palette.glsl).
#
#  1 = foliage (leaves)
#  2 = grass
#  3 = wood
#  4 = stone
#  5 = soil
#  6 = snow
#
# Water/lava use gbuffers_water (MAT_WATER). Unlisted blocks = MAT_DEFAULT.

block.1=oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves dark_oak_leaves mangrove_leaves cherry_leaves azalea_leaves flowering_azalea_leaves
block.2=grass_block short_grass tall_grass fern large_fern sunflower lilac rose_bush peony pink_petals wildflowers
block.3=oak_log spruce_log birch_log jungle_log acacia_log dark_oak_log mangrove_log cherry_log stripped_oak_log stripped_spruce_log stripped_birch_log stripped_jungle_log stripped_acacia_log stripped_dark_oak_log stripped_cherry_log oak_planks spruce_planks birch_planks jungle_planks acacia_planks dark_oak_planks mangrove_planks cherry_planks bamboo_block bamboo_mosaic bamboo_planks
block.4=stone cobblestone mossy_cobblestone stone_bricks mossy_stone_bricks cracked_stone_bricks chiseled_stone_bricks deepslate cobbled_deepslate polished_deepslate deepslate_bricks deepslate_tiles granite polished_granite diorite polished_diorite andesite polished_andesite tuff calcite smooth_stone smooth_basalt basalt blackstone
block.5=dirt coarse_dirt rooted_dirt mud muddy_mangrove_roots farmland dirt_path gravel sand red_sand clay podzol mycelium
block.6=snow_block powder_snow
