# =========================================================
# GoldenHaze — block ID mapping for mc_Entity
# =========================================================
# Iris/OptiFine reads this file and fills the `mc_Entity` vertex
# attribute with the ID assigned here, so shaders can identify
# block types reliably (no texture/alpha heuristics).
#
# ID 1 = all leaf blocks -> foliage shimmer in gbuffers_terrain.
# Syntax: block.<id>=<block1> <block2> ... (SPACE-separated,
# NO colons between entries, no minecraft: namespace needed).
# Water/lava don't need an entry: they go through gbuffers_water.

block.1=oak_leaves spruce_leaves birch_leaves jungle_leaves acacia_leaves dark_oak_leaves mangrove_leaves cherry_leaves azalea_leaves flowering_azalea_leaves
