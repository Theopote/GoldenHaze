# =========================================================
# GoldenHaze — Iris Shader Pack
# shaders.properties
# =========================================================
# Painterly animation-background renderer for Minecraft.
# GBuffer 2.0 + forward painterly lighting + semantic bloom post.

# ---- Custom render targets (GBuffer 2.0) -------------------
# colortex0 = lit scene color (gbuffers)
# colortex1 = GBuffer: encoded view-normal (RGB) + material ID (A)
# colortex2 = bloom working buffer (extract → blur, read by final)
# colortex3 = god-ray accumulation (composite3, read by final)
colortex1Format=RGBA16F
colortex1Clear=true
colortex2Format=RGBA16F
colortex2Clear=true
colortex3Format=RGBA16F
colortex3Clear=true

# ---- Shadow map (stylized sun shadows, Phase 2.3) ----------
shadowMapResolution=1024
shadowDistance=128.0
shadowIntervalSize=1.0
shadowHardwareFiltering=false
generateShadowMipmap=false

# ---- Custom textures ---------------------------------------
texture.final.canvas=textures/canvas.png

# ---- In-game shader options ---------------------------------
sliderOptions=DEBUG_VIEW SUN_STRENGTH SKY_STRENGTH BOUNCE_STRENGTH BLOOM_STRENGTH BLOOM_THRESHOLD WARMTH VIGNETTE_STRENGTH GODRAY_STRENGTH GODRAY_SAMPLES GODRAY_DENSITY GODRAY_DECAY GODRAY_EXPOSURE CLOUD_COVERAGE SHIMMER_STRENGTH GRAIN_STRENGTH CHROMA_STRENGTH ATMOSPHERE_STRENGTH ATMOSPHERE_START ATMOSPHERE_END PAINTERLY_STRENGTH SHADOW_STRENGTH SHADOW_SOFTNESS FOLIAGE_STRENGTH WATER_STRENGTH WATER_DIST_NEAR WATER_DIST_FAR PALETTE_STRENGTH
booleanOptions=ENABLE_GODRAYS ENABLE_CLOUDS

screen=[LIGHTING] [ATMOSPHERE] [FOLIAGE] [WATER] [SKY] [POST] [DEBUG] [EXPERIMENTAL]

screen.LIGHTING=SUN_STRENGTH SKY_STRENGTH BOUNCE_STRENGTH PAINTERLY_STRENGTH PALETTE_STRENGTH SHADOW_STRENGTH SHADOW_SOFTNESS
screen.LIGHTING.columns=2

screen.ATMOSPHERE=ATMOSPHERE_STRENGTH ATMOSPHERE_START ATMOSPHERE_END
screen.ATMOSPHERE.columns=2

screen.FOLIAGE=FOLIAGE_STRENGTH SHIMMER_STRENGTH
screen.FOLIAGE.columns=2

screen.WATER=WATER_STRENGTH WATER_DIST_NEAR WATER_DIST_FAR SHIMMER_STRENGTH
screen.WATER.columns=2

screen.SKY=CLOUD_COVERAGE ENABLE_CLOUDS
screen.SKY.columns=2

screen.POST=BLOOM_STRENGTH BLOOM_THRESHOLD GODRAY_STRENGTH GODRAY_SAMPLES GODRAY_DENSITY GODRAY_DECAY GODRAY_EXPOSURE ENABLE_GODRAYS WARMTH VIGNETTE_STRENGTH GRAIN_STRENGTH
screen.POST.columns=2

screen.DEBUG=DEBUG_VIEW
screen.DEBUG.columns=1

screen.EXPERIMENTAL=CHROMA_STRENGTH
screen.EXPERIMENTAL.columns=1

screen.columns=2
