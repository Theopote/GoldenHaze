# =========================================================
# GoldenHaze — Iris Shader Pack
# shaders.properties
# =========================================================
# Warm, painterly, glow-heavy aesthetic: soft bloom, split-tone
# color grading (cool shadows / warm highlights), gentle vignette
# and grain. Think "sunlit afternoon in a hand-painted world",
# not photorealism.

# ---- Custom render targets --------------------------------
# colortex1 = bright-pass buffer, reused as ping-pong target for
#             the two-pass gaussian blur that produces the bloom.
#             Also sampled by composite2's god-ray march.
# colortex2 = god-ray accumulation buffer (written by composite2,
#             read by final). RGBA16F keeps the HDR shaft energy.
colortex1Format=RGBA16F
colortex1Clear=true
colortex2Format=RGBA16F
colortex2Clear=true

# ---- Custom textures ---------------------------------------
# canvas = procedural paper/canvas grain, sampled in final.fsh.
# Format: texture.<stage>.<samplerName> = <path relative to shaders/>
# The stage for textures used in final.fsh is "composite".
texture.composite.canvas=textures/canvas.png

# ---- In-game shader options ---------------------------------
sliderOptions=BLOOM_STRENGTH BLOOM_THRESHOLD WARMTH VIGNETTE_STRENGTH GODRAY_STRENGTH GODRAY_SAMPLES GODRAY_DENSITY GODRAY_DECAY GODRAY_EXPOSURE CLOUD_COVERAGE SHIMMER_STRENGTH GRAIN_STRENGTH CHROMA_STRENGTH
booleanOptions=ENABLE_GODRAYS ENABLE_CLOUDS

screen=BLOOM_STRENGTH BLOOM_THRESHOLD GODRAY_STRENGTH GODRAY_SAMPLES GODRAY_DENSITY GODRAY_DECAY GODRAY_EXPOSURE ENABLE_GODRAYS CLOUD_COVERAGE ENABLE_CLOUDS SHIMMER_STRENGTH WARMTH VIGNETTE_STRENGTH GRAIN_STRENGTH CHROMA_STRENGTH
screen.columns=2
