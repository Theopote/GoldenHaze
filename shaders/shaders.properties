# =========================================================
# GoldenHaze — Iris Shader Pack
# shaders.properties
# =========================================================
# Warm, painterly, glow-heavy aesthetic: soft bloom, split-tone
# color grading (cool shadows / warm highlights), gentle vignette
# and grain. Think "sunlit afternoon in a hand-painted world",
# not photorealism.

# ---- Custom render targets (GBuffer 2.0) -------------------
# colortex0 = lit scene color (gbuffers)
# colortex1 = GBuffer: encoded view-normal (RGB) + material ID (A)
# colortex2 = bloom working buffer (extract → blur, read by final)
# colortex3 = god-ray accumulation (composite3, read by final)
colortex1Format=RGBA16F
colortex1Clear=true
colortex2Format=RGBA16F
colortex2Clear=true
colortex3Format=RGBA16F
colortex3Clear=true

# ---- Shadow map (stylized sun shadows, Phase 2.3) ----------
shadowMapResolution=2048
shadowDistance=128.0
shadowIntervalSize=1.0
shadowHardwareFiltering=false
generateShadowMipmap=false

# ---- Custom textures ---------------------------------------
# canvas = procedural paper/canvas grain, sampled in final.fsh.
# Format: texture.<stage>.<samplerName> = <path relative to shaders/>
# The stage keyword must match the actual pass filename the sampler
# is used in — canvas is read in final.fsh, so the stage is "final".
texture.final.canvas=textures/canvas.png

# ---- In-game shader options ---------------------------------
sliderOptions=BLOOM_STRENGTH BLOOM_THRESHOLD WARMTH VIGNETTE_STRENGTH GODRAY_STRENGTH GODRAY_SAMPLES GODRAY_DENSITY GODRAY_DECAY GODRAY_EXPOSURE CLOUD_COVERAGE SHIMMER_STRENGTH GRAIN_STRENGTH CHROMA_STRENGTH ATMOSPHERE_STRENGTH ATMOSPHERE_START ATMOSPHERE_END PAINTERLY_STRENGTH SHADOW_STRENGTH SHADOW_SOFTNESS
booleanOptions=ENABLE_GODRAYS ENABLE_CLOUDS

screen=BLOOM_STRENGTH BLOOM_THRESHOLD GODRAY_STRENGTH GODRAY_SAMPLES GODRAY_DENSITY GODRAY_DECAY GODRAY_EXPOSURE ENABLE_GODRAYS CLOUD_COVERAGE ENABLE_CLOUDS SHIMMER_STRENGTH PAINTERLY_STRENGTH SHADOW_STRENGTH SHADOW_SOFTNESS ATMOSPHERE_STRENGTH ATMOSPHERE_START ATMOSPHERE_END WARMTH VIGNETTE_STRENGTH GRAIN_STRENGTH CHROMA_STRENGTH
screen.columns=2
